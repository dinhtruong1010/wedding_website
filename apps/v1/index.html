<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Đình Trường & Thanh Ngà · Thiệp cưới 12.12.2026</title>
    <meta name="description" content="Trân trọng kính mời bạn đến chung vui trong lễ cưới của Đình Trường & Thanh Ngà · 12.12.2026 · Aquaria Palace, Hà Nội." />
    <meta name="theme-color" content="#fbe4e9" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Đình Trường & Thanh Ngà · Thiệp cưới" />
    <meta property="og:description" content="Chúng mình sắp kết hôn và rất mong được cùng bạn chung vui · 12.12.2026" />
    <meta property="og:image" content="/data/hero-desktop.jpg" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%97%3C/text%3E%3C/svg%3E" />

    <!-- Fonts: loaded from <head> (not a CSS @import) so they don't block CSS parsing. All support Vietnamese. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap&subset=vietnamese"
    />

    <style>
      /* Boot screen shown before React mounts; matches the React cover so the hand-off is seamless. */
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: radial-gradient(circle at 20% 15%, #fde2e8 0, transparent 45%),
          radial-gradient(circle at 85% 85%, #f3e3d3 0, transparent 50%), #fff7f3;
        color: #b84d70;
        font-family: "Nunito", system-ui, sans-serif;
      }
      .boot-heart {
        font-size: 2.75rem;
        animation: boot-beat 1.1s ease-in-out infinite;
      }
      .boot-text {
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        opacity: 0.8;
      }
      @keyframes boot-beat {
        0%, 100% { transform: scale(1); }
        15% { transform: scale(1.18); }
        30% { transform: scale(0.96); }
        45% { transform: scale(1.12); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-live="polite">
        <div class="boot-heart" aria-hidden="true">💗</div>
        <div class="boot-text">Đang mở thiệp…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
